input {
  file {
    path => "/logs/transactions.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"   # rejoue tout à chaque run -> pratique en dev/démo
    tags => ["txn_raw"]
  }
  file {
    path => "/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["auth_raw"]
  }
  file {
    path => "/logs/atm.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["atm_raw"]
  }
}

filter {

  # Windows écrit les fichiers avec des fins de ligne \r\n (le générateur les
  # ouvre en mode texte -> Python traduit \n en \r\n sous Windows). On nettoie
  # AVANT tout parsing pour ne pas polluer le dernier champ de chaque ligne.
  mutate {
    gsub => ["message", "\r$", ""]
  }

  # ---------- 1) TRANSACTIONS (key=value) ----------
  if "txn_raw" in [tags] {
    kv {
      field_split => " "
      value_split => "="
    }

    # Une ligne saine DOIT avoir tous ces champs. Le générateur mutile
    # certaines lignes (coupe brute ou suppression de "="), ce qui casse
    # kv silencieusement -> on vérifie explicitement.
    # NOTE: on NE teste PAS ![card_present] ici : en Logstash, la chaîne
    # littérale "false" est évaluée comme fausse par un test de vérité, donc
    # ![card_present] serait vrai (= "champ absent") même quand le champ
    # existe avec la valeur "false" -> ça enverrait ~40% des transactions
    # saines en dead-letter à tort. Les 7 autres champs suffisent à détecter
    # une ligne tronquée par le générateur.
    if ![ts] or ![ev] or ![id] or ![amount] or ![currency] or ![country] or ![status] {
      mutate { add_tag => ["_dead_letter"] add_field => { "dead_letter_reason" => "txn_missing_fields" } }
    } else {
      date {
        match => ["ts", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_dead_letter"]
      }
      mutate {
        convert => {
          "amount" => "float"
          "card_present" => "boolean"
        }
        rename => { "country" => "country_code" }
      }
    }
  }

  # ---------- 2) AUTH (JSON) ----------
  if "auth_raw" in [tags] {
    json {
      source => "message"
      tag_on_failure => ["_jsonparsefailure", "_dead_letter"]
    }
    if "_dead_letter" not in [tags] {
      date {
        match => ["ts", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_dead_letter"]
      }
      geoip {
        source => "ip"
        target => "geoip"
        ecs_compatibility => "disabled"   # noms de champs stables (country_name, location...)
        tag_on_failure => ["_geoip_lookup_failure"]  # ne doit PAS envoyer en dead-letter
      }
    }
  }

  # ---------- 3) ATM (CSV) ----------
  if "atm_raw" in [tags] {
    if [message] == "ts,atm_id,city,op,amount,result" {
      drop {}   # ligne d'en-tête du CSV, pas une donnée
    }
    csv {
      columns => ["ts", "atm_id", "city", "op", "amount", "result"]
      separator => ","
    }
    if ![ts] or ![atm_id] or ![amount] {
      mutate { add_tag => ["_dead_letter"] add_field => { "dead_letter_reason" => "atm_missing_fields" } }
    } else {
      date {
        match => ["ts", "ISO8601"]
        target => "@timestamp"
        tag_on_failure => ["_dead_letter"]
      }
      mutate {
        convert => { "amount" => "float" }
      }
    }
  }

  mutate {
    remove_field => ["ts", "@version", "path", "host", "event"]
  }
}

output {
  if "_dead_letter" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-transactions-deadletter-%{+YYYY.MM.dd}"
    }
  } else if "txn_raw" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-transactions-txn-%{+YYYY.MM.dd}"
    }
  } else if "auth_raw" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-transactions-auth-%{+YYYY.MM.dd}"
    }
  } else if "atm_raw" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bank-transactions-atm-%{+YYYY.MM.dd}"
    }
  }
  # stdout { codec => rubydebug }  # décommente pour débugger en local
}
